<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mut:#5b6478;--bd:#d9deea;--pr:#3b5bdb;--ok:#2b8a3e;--okb:#e6f6ea;--no:#c92a2a;--nob:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1424;--card:#1a2138;--tx:#e8ecf7;--mut:#9aa5c0;--bd:#2c3556;--pr:#7c96ff;--ok:#5fd07a;--okb:#16301f;--no:#ff7b7b;--nob:#3a1b1f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1424;--card:#1a2138;--tx:#e8ecf7;--mut:#9aa5c0;--bd:#2c3556;--pr:#7c96ff;--ok:#5fd07a;--okb:#16301f;--no:#ff7b7b;--nob:#3a1b1f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px}
.meter{display:flex;align-items:center;gap:10px}
.ring{position:relative;width:64px;height:64px}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:var(--bd)}.ring .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:.8rem}
.lbl{font-size:.8rem;color:var(--mut)}.big{font-weight:700;font-size:1.05rem}
#wbox{border:1px solid var(--no);background:var(--nob);color:var(--no);border-radius:12px;padding:8px 14px;text-align:center}
#wbox b{display:block;font-size:1.3rem;line-height:1.2}
.wr{justify-self:end;display:flex;align-items:center;gap:8px}
#rs{display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:.78rem;line-height:1;color:var(--mut);background:transparent;border:1px solid var(--bd);border-radius:999px;padding:6px 12px;cursor:pointer}
#rs:hover{color:var(--pr);border-color:var(--pr)}
#rs .ic{font-size:1rem}
#wq{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--pr);background:var(--card);color:var(--pr);font:inherit;font-weight:700;font-size:1rem;line-height:1;padding:0;cursor:pointer;text-shadow:0 0 6px var(--pr);animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 3px 0 var(--pr)}50%{box-shadow:0 0 12px 3px var(--pr)}}
#wq:hover{animation-duration:1.1s}
#rs:focus-visible,#wq:focus-visible,.pb:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#wq{animation:none;box-shadow:0 0 8px 1px var(--pr)}.ov.on .md{animation:none!important}}
@media (max-width:520px){header{padding:8px 10px;gap:6px}.ring,.ring svg{width:52px;height:52px}.lbl{font-size:.72rem}.big{font-size:.95rem}#rs .rl{display:none}#rs{padding:6px 9px}#wbox{padding:5px 8px}#wbox b{font-size:1.1rem}.wr{gap:6px}#wq{width:28px;height:28px}}
main{max-width:760px;margin:0 auto;padding:12px 14px 40px}
h1{font-size:1.25rem;margin:14px 0 4px}
.sep{display:flex;align-items:center;gap:10px;margin:36px 0 16px;color:var(--mut);font-size:.88rem;font-weight:600}.sep::before,.sep::after{content:'';flex:1;border-top:2px dashed var(--bd)}h2{font-size:1.05rem;color:var(--pr);margin:26px 0 8px;border-bottom:2px solid var(--bd);padding-bottom:4px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0;scroll-margin-top:calc(110px + env(safe-area-inset-top,0px))}
.q.flash{animation:fl 1.6s}@keyframes fl{0%,60%{box-shadow:0 0 0 3px var(--pr)}100%{box-shadow:none}}
.meta{font-size:.78rem;color:var(--mut);margin-bottom:4px}
.qt{font-weight:600;margin-bottom:10px}
.op{display:flex;gap:10px;width:100%;text-align:start;font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:10px;padding:9px 12px;margin:6px 0;cursor:pointer}
.op:hover:not(:disabled){border-color:var(--pr)}.op:disabled{cursor:default}
.op b{color:var(--pr)}
.op.ok{background:var(--okb);border-color:var(--ok)}.op.no{background:var(--nob);border-color:var(--no)}
.fb{display:none;margin-top:8px;padding:9px 12px;border-radius:10px;font-size:.92rem}
.fb.ok{display:block;background:var(--okb);color:var(--ok)}.fb.no{display:block;background:var(--nob)}
.fb.no strong{color:var(--no)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov.on{display:flex}
.md{background:var(--card);border-radius:16px;max-width:520px;width:100%;max-height:80vh;overflow:auto;padding:16px;border:1px solid var(--bd)}
.md h3{margin:0 0 10px}.md button.it{display:block;width:100%;text-align:start;font:inherit;color:var(--tx);background:transparent;border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:6px 0;cursor:pointer}
.md button.it:hover{border-color:var(--pr)}
.tag{font-size:.75rem;border-radius:8px;padding:1px 8px;margin-inline-end:6px;background:var(--nob);color:var(--no)}.tag.m{background:var(--bd);color:var(--mut)}
.x{float:right;border:0;background:none;color:var(--mut);font-size:1.4rem;cursor:pointer}
.ov.on .md{animation:pop .22s ease-out}@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
#rov .md{max-width:400px;text-align:center}
#rsc{font-size:2.6rem;font-weight:800;line-height:1.1;margin-top:6px}
#rpc{color:var(--mut);font-size:.95rem}
#rmsg{font-size:1.2rem;font-weight:700;margin:12px 0 4px}
#rgif{display:block;max-width:100%;max-height:260px;margin:12px auto 0;border-radius:12px}
.pb{margin-top:16px;font:inherit;font-weight:600;color:#fff;background:var(--pr);border:0;border-radius:10px;padding:8px 26px;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pb{color:#0f1424}}
:root[data-theme="dark"] .pb{color:#0f1424}
.none{color:var(--mut);margin:18px 0;text-align:center}
.fb .ar{margin-top:6px}
</style>

<script>
// ---------- LECTURES (section headings; lecture number 1, 2, 3 = position in this list) ----------
const L=["Lectures 1 &amp; 2: Maritime Transport as a Mode of Tourist Transport","Lecture 3: Maritime Transport Means Used in Tourism","Maritime Terminology"];

// ---------- QUESTIONS: add yours inside R, one per line ----------
// Multiple choice: [lecture, "Question", ["Option A","Option B","Option C","Option D"], indexOfCorrectOption (0-3), "Explanation"],
// True / false:    [lecture, "Statement", 1 (statement is true) or 0 (statement is false), "Explanation"],
// Arabic text is detected automatically and shown right-to-left.
const R=[
// Lectures 1 & 2
[1, "يقوم النقل في السياحة بدورين: السفر بين بلد السائح الأصلية والمقصد، والانتقال داخل المقصد. ما الفرق بين الدورين من حيث التوقيت ووسيلة النقل؟", ["الأول خلال فترة الإقامة بأكملها، والثاني في بداية الرحلة ونهايتها بوسيلة المقيمين نفسها", "الأول في بداية الرحلة ونهايتها فقط، والثاني خلال الإقامة بوسائل خاصة بالسائحين دون المقيمين", "الأول والثاني معاً في بداية الرحلة ونهايتها فقط، بوسيلة المقيمين والعاملين نفسها", "الأول في بداية الرحلة ونهايتها فقط، والثاني خلال الإقامة بوسيلة المقيمين نفسها"], 3, "يوفر النقل وسيلة السفر إلى المقصد السياحي من بلد السائح الأصلية والعكس، وهذا النوع نجده في بداية ونهاية الرحلة فقط. كما يوفر وسيلة الانتقال داخل المقصد حين يصل السائحون ويبدأون استكشافه، وتكون هي نفسها الوسيلة التي يستخدمها المقيمون والعاملون في البلد، ونجدها في الفترة التي يقيم فيها السائح بالمقصد."],
[1, "تقدم السفينة في رحلة الكاريبيان البحرية الإقامة والوجبات والترفيه إلى جانب سفر السائحين، ولا يغادرها السائحون إلا عند نهاية الرحلة. ماذا يعني ذلك بالنسبة لدور النقل؟", ["أن النقل استُخدم لتنقل السائحين داخل المقصد كما يتنقل المقيمون", "أن شكل النقل نفسه أصبح من الملامح الرئيسية للرحلة السياحية", "أن النقل اقتصر على السفر في بداية الرحلة ونهايتها فقط", "أن الرحلة اعتمدت على نقل متعدد الوسائط بوسائل متعاقبة"], 1, "يصبح النقل من الملامح الرئيسية للرحلة حين يكون شكل النقل نفسه أحد أهم أسباب القيام بها، كالسفينة في رحلة الكاريبيان التي تقدم الإقامة والوجبات والترفيه ويستمر استخدامها من بداية الرحلة إلى نهايتها."],
[1, "تبدأ رحلة سائح بالطائرة من بلده إلى القاهرة، ثم بالقطار أو الباخرة النيلية إلى الأقصر، ثم بالأتوبيس والحنطور داخل المدينة وصولاً إلى وادي الملوك. بماذا يوصف هذا الشكل من النقل؟", ["النقل الخاص الذي يستخدمه المقيمون والعاملون في البلد", "النقل المشترك الذي يجمع بين المسارين الجوي والمائي", "النقل متعدد الوسائط (Multimodal Transport)", "النقل المتخصص الذي يخدم الركاب دون البضائع"], 2, "النقل متعدد الوسائط هو الذي تستخدم فيه وسائل نقل مختلفة على نحو متعاقب لتغطية المراحل المختلفة للرحلة السياحية، وتزداد أهميته مع اتساع النشاط السياحي ليشمل السياحة الدولية وليس الداخلية فقط."],
[1, "أي مما يلي يربط بشكل صحيح بين أساس تقسيم وسائل النقل والتقسيم الذي يندرج تحته؟", ["وفقاً لمستوى الخدمة: نقل ركاب فقط أو نقل بضائع فقط", "وفقاً لنوعية الخدمة: مجدولة بجداول معلنة أو تحت الطلب", "وفقاً لمجال التشغيل: داخلي داخل الدولة وخارجي خارجها", "وفقاً للمسار: نقل عام متاح للجميع أو نقل خاص"], 2, "تقسم وسائل النقل وفقاً لمجال التشغيل (داخلي/خارجي)، وللمسار (مائي/بري/جوي/مشترك)، ولنوعية الخدمة (متخصصة: ركاب أو بضائع، ومشتركة: بضائع وركاب)، ولمستوى الخدمة (السرعة وانتظام الخدمة)، ولطبيعة وسيلة النقل (عام أو خاص)."],
[1, "خدمة نقل بحرية سريعة تعمل تحت الطلب وليس وفق جدول زمني ثابت. أي تقسيمين من تقسيمات وسائل النقل يعبر عنهما هذا الوصف؟", ["السرعة وانتظام الخدمة، وكلاهما ضمن مستوى الخدمة", "السرعة وطبيعة وسيلة النقل، وكلاهما ضمن مجال التشغيل", "السرعة ونوعية الخدمة، وكلاهما ضمن المسار", "مجال التشغيل وانتظام الخدمة، وكلاهما ضمن المسار"], 0, "وفقاً لمستوى الخدمة تقسم الوسائل إلى: السرعة (عادي أو سريع)، وانتظام الخدمة (مجدولة أو تحت الطلب)."],
[1, "أي مما يلي يعبر بدقة عن الأنماط الرئيسية للنقل السياحي التي تناولتها المحاضرة وتفرع النقل المائي منها؟", ["البري والجوي والبحري، ويتفرع البحري إلى نهري ومائي", "البري والمائي فقط، ويتفرع المائي إلى جوي وبحري", "البري والجوي والمشترك، ويتفرع المشترك إلى نهري وبحري", "البري والجوي والمائي، ويتفرع المائي إلى نهري وبحري"], 3, "الأنماط الرئيسية المستخدمة في النقل السياحي هي: النقل البري، والنقل الجوي، والنقل المائي الذي يتفرع إلى النقل النهري والنقل البحري."],
[1, "أي مما يلي يدخل ضمن مفهوم النقل البحري كما ورد في المحاضرة؟", ["التنقل بالحنطور بين أحياء مدينة الأقصر", "نقل الركاب بالسفن عبر الأنهار بين المدن", "رحلات الباخرة النيلية بين القاهرة والأقصر", "رحلات اليخوت سواء كانت صغيرة أو كبيرة"], 3, "يقصد بالنقل البحري النقل بالسفن عبر البحار والمحيطات بين الجهات المطلة عليها من خلال الرحلات المنظمة عبر الخطوط البحرية، إضافة إلى رحلات اليخوت صغيرة أو كبيرة. أما الباخرة النيلية فتندرج تحت النقل النهري."],
[1, "أين ظهر النقل عبر البحار تاريخياً وعلى يد من؟", ["في المحيط الهادي على يد اليونانيين والرومان والعرب دون المصريين القدماء", "في البحر المتوسط على يد المصريين القدماء والفينيقيين واليونانيين والرومان والعرب", "في الخليج الفنلندي والقنال الإنكليزي على يد السويديين والفنلنديين والإنكليز", "في المحيط الأطلسي على يد البريطانيين والفرنسيين والأمريكيين وغيرهم من الأوروبيين"], 1, "تاريخياً ظهر النقل عبر البحار في منطقة البحر المتوسط بواسطة المصريين القدماء والفينيقيين واليونانيين والرومان والعرب."],
[1, "أي العبارات التالية عن السفينة تيتانيك صحيحة وفق المحاضرة؟", ["بلغ عرضها نحو 229 متراً وطولها نحو 28 متراً", "كان عدد الناجين من رحلتها أكبر من عدد المفقودين", "صُممت لتسع 2500 راكب وبُنيت في ترسانة بلفاست", "غرقت عام 1912 أثناء رحلتها من نيويورك إلى ساوثهامبتون"], 2, "صممت تيتانيك لتسع 2500 راكب وبنيت في ترسانة بلفاست بأيرلندا، وبلغ طولها نحو 229 متراً وعرضها 28 متراً، وغرقت عام 1912 باصطدامها بجبل ثلجي في رحلتها من ساوثهامبتون إلى نيويورك، ولم ينج من 2262 فرداً سوى 705."],
[1, "متى بدأ التوسع في استخدام النقل البحري في أغراض السياحة والترويح، وما أبرز مظاهره؟", ["قبل الحرب العالمية الأولى، ببناء تيتانيك أضخم سفينة ركاب في العالم", "بعد الحرب العالمية الثانية، بانطلاق أكثر من 50 سفينة يومياً من نيويورك", "بعد الحرب العالمية الأولى، بتعدد الرحلات السياحية عبر الأطلسي", "في عقد الثلاثينات، ببناء السفينتين البريطانيتين كوين ماري وكوين إليزابيث"], 2, "بدأ التوسع في استخدام النقل البحري في السياحة والترويح بعد الحرب العالمية الأولى، وخاصة خلال عقد العشرينات الذي تعددت فيه الرحلات البحرية السياحية العابرة للمحيط الأطلسي والمتجهة إلى البحر المتوسط."],
[1, "أي ترتيب زمني لبناء السفن التالية صحيح وفق المحاضرة؟", ["السفينة الفرنسية (France) ثم كوين ماري ثم كوين إليزابيث", "كوين إليزابيث ثم كوين ماري ثم السفينة الفرنسية (France)", "كوين ماري ثم السفينة الفرنسية (France) ثم كوين إليزابيث", "السفينة الفرنسية (France) ثم كوين إليزابيث ثم كوين ماري"], 0, "بنى الفرنسيون السفينة France عام 1926، ثم بنيت السفينة البريطانية كوين ماري عام 1934 بضعف حجم السفينة الفرنسية، ثم بنيت كوين إليزابيث عام 1938."],
[1, "يتميز النقل البحري بعدم وجود طرق محددة المسار تلتزم بها السفن. أي مما يلي يمثل الاستثناء من هذه الخاصية؟", ["الممرات الملاحية المؤدية إلى الموانئ التي يحددها شكل القاع وعمق المياه", "الرحلات السياحية البحرية العابرة للمحيط الأطلسي خلال عقد العشرينات", "المحيطات المتسعة التي تفصل بين الجهات المطلة عليها بسواحلها الممتدة", "المسطحات البحرية الدولية والإقليمية المفتوحة أمام حركة السفن"], 0, "لا تلتزم السفن بطرق محددة المسار، ويستثنى من ذلك الممرات الملاحية (Navigation routes) المؤدية إلى الموانئ البحرية، والتي يحدد مسارها عادة مورفولوجية القاع وعمق المياه."],
[1, "يتمتع المرور في المسطحات البحرية الدولية والإقليمية بالمجانية. أين ينطبق الاستثناء من هذه الخاصية؟", ["خطوط الرحلات السياحية البحرية المنتظمة العابرة للأطلسي", "الممرات الملاحية المؤدية إلى الموانئ ذات الأعماق الكبيرة", "الممرات ذات التجهيزات الخاصة كقناتي السويس وبنما", "المسطحات البحرية التي يتكون فيها الجليد خلال الشتاء"], 2, "مجانية المرور في المسطحات البحرية دولية كانت أو إقليمية يستثنى منها المرور في الممرات البحرية ذات التجهيزات الخاصة كقناتي السويس وبنما."],
[1, "يعد النقل البحري أقل أنماط النقل تكلفة. ما السببان اللذان تذكرهما المحاضرة لذلك؟", ["مجانية المرور في جميع الممرات البحرية وقصر المسافات المقطوعة", "انخفاض أجور العاملين وتجنب رسوم المرور في القنوات الصناعية", "ارتفاع سرعة السفن وتقارب الموانئ على الخط البحري الواحد", "انخفاض نفقات القوى المحركة وكبر قدرة وحدات النقل على الحمل"], 3, "تتلخص أسباب انخفاض تكلفة النقل البحري في انخفاض نفقات القوى المحركة في مجال النقل المائي، بالإضافة إلى القدرة الكبيرة لوحدات النقل المائي على الحمل."],
[1, "سائح يريد زيارة عدة بلدان وشعوب متنوعة خلال رحلة واحدة دون أن يغير مكان إقامته أو يبحث عن فنادق ومطاعم ومطارات. أي ميزة للنقل البحري السياحي تلبي رغبته؟", ["انخفاض تكلفة النقل مقارنة بباقي أنماط النقل الأخرى", "التوقف في عدة موانئ مع بقاء الإقامة على متن السفينة", "مجانية المرور في المسطحات البحرية الدولية والإقليمية", "القدرة على حمل الأمتعة بصرف النظر عن حجمها وعن وزنها"], 1, "من مميزات النقل البحري في السياحة التوقف في عدة موانئ على الطريق البحري، فيتعرف السائح على بلدان وشعوب متعددة ويزور مواقع متباينة دون أن يغير مكان إقامته أو يبحث عن الفنادق والمطاعم والمطارات، وهي أمور تستغرق جزءاً ليس بقليل من زمن الرحلة."],
[1, "تسافر عائلة سياحية ومعها معدات رياضية وأمتعة كبيرة الحجم والوزن، وترغب في ممارسة هواياتها خلال الرحلة. أي ميزة للنقل البحري تناسبها؟", ["القدرة على النقل لمسافات تفوق ما تقطعه أي وسيلة أخرى", "حمل كل ما ترغب في استخدامه بصرف النظر عن حجمه ووزنه", "كون الطريق المائي أكثر الطرق أمناً في مختلف الظروف", "التوقف في عدة موانئ دون تغيير مكان الإقامة على السفينة"], 1, "تمكّن وسائل النقل البحري المسافر من حمل كل ما يرغب في استخدامه أو التمتع به خلال رحلته من أمتعة وأغراض بصرف النظر عن حجمها ووزنها، مما يعني توافر الراحة والمتعة وممارسة الهوايات للسائح البحري."],
[1, "أي مجموعة تضم عوامل بشرية فقط من العوامل المؤثرة في النقل البحري؟", ["شبكة خطوط النقل الداخلية وتضاريس القاع والقنوات الصناعية", "المساحات المائية وشبكة خطوط النقل وانخفاض تكلفة النقل", "خط الساحل وانخفاض تكلفة النقل والقنوات البحرية الصناعية", "شبكة خطوط النقل وانخفاض تكلفة النقل والقنوات الصناعية"], 3, "العوامل البشرية ثلاثة: توافر شبكة جيدة من خطوط النقل بين الميناء والأجزاء الداخلية، وانخفاض تكلفة النقل البحري، والقنوات البحرية الصناعية. أما الطبيعية فخمسة: الموقع الجغرافي، وخط الساحل، وتضاريس القاع، والمساحات المائية، والمناخ."],
[1, "لماذا تفضل الشركات الملاحية اقتصادياً أن تمر خطوطها البحرية على موانئ متقاربة جغرافياً؟", ["لأن قصر المسافات بين الموانئ يسهل التزود بالوقود ويقلل الوقود المحمول", "لأن تقارب الموانئ يلغي الحاجة إلى التزود بالوقود في الرحلة الواحدة", "لأن تقارب الموانئ يزيد كمية الوقود المحمولة لضمان استمرار الرحلة", "لأن الموانئ المتقاربة تتمتع بأعماق مياه أكبر تستقبل السفن الضخمة"], 0, "تحدد المواقع الجغرافية للموانئ المسافات بين موانئ الوصول والمغادرة ونقاط التزود بالوقود، وتفضل الشركات الملاحية اقتصادياً الموانئ المتقاربة لأن قصر المسافات يعني سهولة التزود بالوقود وبالتالي تقليل كمية الوقود التي تحملها السفينة خلال الرحلة الواحدة."],
[1, "ما العاملان الرئيسيان اللذان يفسران تباين أشكال خط الساحل بين الخطوط المستقيمة والخلجان والمضايق؟", ["درجة الحرارة وتكون الجليد، وكثافة الضباب فوق التيارات الباردة", "طبيعة الساحل وتركيبه الصخري، وتأثير الأمواج والمد والجزر والتيارات", "اتساع الظهير الذي يخدمه الميناء، وانخفاض تكلفة النقل البحري", "عمق المياه المجاورة للساحل، ونمو الأعشاب والشعاب المرجانية"], 1, "مرد التباين في أشكال خط الساحل عاملان رئيسيان: طبيعة الساحل وتباين تركيبه الصخري، وتأثير الأمواج والمد والجزر والتيارات البحرية."],
[1, "تتعرض وحدة بحرية صغيرة الحجم لعواصف بحرية شديدة قرب الساحل. أي سمة في شكل خط الساحل تتيح لها الاحتماء؟", ["استقامته التي تقصر المسافات الفاصلة بين الموانئ المتجاورة", "تعرجاته من خلجان ومضايق تحتمي فيها الوحدات البحرية", "عمق المياه الملاصقة له الذي يقلل أثر الرياح والأمواج", "اتساع الظهير الذي يخدمه الميناء القريب من هذا الساحل"], 1, "تشكل تعرجات خط الساحل أماكن جيدة لإنشاء الموانئ البحرية إذا توافرت عوامل أخرى، كما أنها نطاقات تحتمي فيها الوحدات البحرية، خاصة صغيرة الحجم منها، خلال فترات هبوب العواصف البحرية الشديدة."],
[1, "ما الدور الذي تؤديه تضاريس قيعان البحار والمحيطات بالنسبة للسفن؟", ["تحدد المسافات بين موانئ الوصول والمغادرة ونقاط التزود بالوقود", "تحدد أبعاد ومواصفات السفن التي يمكن للميناء استقبالها في مسطحه المائي", "تحدد مستوى أعماق المياه الموضحة على خرائط خاصة تسترشد بها السفن", "تحدد اتجاه التيارات البحرية وتكون الجليد خلال شهور الشتاء الباردة"], 2, "تحدد تضاريس قيعان البحار والمحيطات مستوى أعماق المياه التي توضع على خرائط خاصة تسترشد بها السفن خلال رحلتها لتحديد مساراتها العامة."],
[1, "ما العوامل التي قد تغير تضاريس قاع المسطحات البحرية فتؤثر مباشرة في مسار القنوات الملاحية المؤدية إلى الميناء؟", ["تكاثف بخار الماء فوق التيارات البحرية الباردة قرب السواحل", "ضحولة المسطح المائي للميناء وكبر غاطس السفن الكبيرة الحديثة", "هبوب الأنواء وتغير اتجاه الرياح خلال فصل الشتاء الطويل", "العوامل الباطنية والترسيب ونمو الأعشاب والشعاب المرجانية"], 3, "من الصعوبات التي تثيرها تضاريس القيعان التغيرات التي قد تتعرض لها نتيجة العوامل الباطنية أو الترسيب أو نمو الأعشاب والشعاب المرجانية، وكلها تؤثر مباشرة في تحديد مسار الممرات أو القنوات الملاحية المؤدية إلى منطقة الميناء."],
[1, "ما المقصود بعامل «المساحات المائية» بين العوامل الطبيعية المؤثرة في النقل البحري؟", ["نسبة البحار والمحيطات من إجمالي المسطحات المائية فوق الأرض", "المسطح المائي الخاص بالميناء وخصائصه، وخاصة الأعماق", "الخط الفاصل بين اليابس والبحر بأشكاله المتباينة", "مستوى أعماق قيعان البحار والمحيطات الموضحة على الخرائط"], 1, "يقصد بالمساحات المائية المسطح المائي الخاص بالميناء وخصائصه، خاصة فيما يتعلق بالأعماق التي تحدد مدى ملاءمته لاستقبال السفن."],
[1, "تراجعت أهمية بعض الموانئ القديمة، ومنها الميناء الشرقية بالإسكندرية لصالح الميناء الغربية. ما التفسير وفق المحاضرة؟", ["تعرض مياهها للجليد في شهور الشتاء وتوقف الملاحة فيها", "ضعف شبكة خطوط النقل التي تربطها بباقي جهات الدولة الداخلية", "كثرة الضباب الناتج عن مرور كتل الهواء فوق تيارات باردة", "ضحولة مسطحها المائي وعجزه عن استقبال السفن كبيرة الغاطس"], 3, "كان لعامل المساحات المائية تأثير مباشر في اضمحلال أهمية بعض الموانئ القديمة لضحولة مسطحاتها المائية وعدم قدرتها على استقبال السفن الكبيرة ذات الغاطس الكبير، ومثال ذلك التحول من الميناء الشرقية إلى الميناء الغربية بالإسكندرية."],
[1, "عندما تنخفض درجة حرارة مياه المسطحات البحرية خلال الشتاء ويتكون الجليد، فما أثر ذلك على الطرق البحرية؟", ["تغيير خطوط سير السفن أو توقف الملاحة في بعض الطرق", "تحسن الرؤية الملاحية وانخفاض خطر الضباب على السفن", "اتساع الظهير الذي يخدمه الميناء وارتفاع كفاءة تشغيله", "زيادة سرعة التيارات البحرية في اتجاه الطريق المتبع"], 0, "يتكون الجليد عند انخفاض درجة الحرارة في مياه المسطحات البحرية والمحيطية خلال الشتاء، فيؤدي إلى تغيير خطوط سير السفن أو توقف الملاحة في بعض الطرق؛ ومازال الجليد يفرض عزلة على موانئ السويد وفنلندا المطلة على خليج بوتنيا."],
[1, "متى تتحول التيارات البحرية من عامل مساعد للسفن إلى خطر على الملاحة في الممرات المؤدية إلى الموانئ؟", ["إذا اتفق اتجاهها مع اتجاه الرياح وقت هبوب الأنواء", "إذا انخفضت درجة الحرارة وتكون الجليد في مياه الشتاء", "إذا سارت في اتجاه الطريق البحري الذي تسلكه السفن", "إذا قل عمق المسطح المائي للميناء عن غاطس السفن"], 0, "تكون التيارات البحرية عاملاً إيجابياً إذا كانت في اتجاه الطريق البحري لأنها تقلل استهلاك الطاقة، لكنها تشكل خطراً كبيراً على الملاحة في الممرات المؤدية إلى الموانئ إذا اتفقت مع اتجاه الرياح، خاصة خلال فترات هبوب الأنواء، وقد يؤدي ذلك إلى غلق بعض الموانئ فترات محددة من السنة."],
[1, "أي مما يلي يوضح الأثر غير المباشر للرياح على النقل البحري؟", ["تكاثف بخار الماء فوق التيارات الباردة وانخفاض مستوى الرؤية", "ترسب الرمال والطمي في القنوات المؤدية إلى منطقة الميناء", "أعاصير وزوابع تجبر السفينة على تخفيض السرعة أو تغيير المسار", "تكون الجليد في الممرات الملاحية خلال شهور الشتاء الباردة"], 2, "للرياح تأثير غير مباشر يتمثل فيما تسببه قوتها من أعاصير وزوابع تشكل خطورة كبيرة على السفن حتى الحديثة منها، وبالتالي على السفينة إما تخفيض السرعة أو تغيير المسار، وقد تصاب بأضرار أو تتعرض للغرق."],
[1, "ما الظاهرة المناخية التي تكثر في الخليج الفنلندي والقنال الإنكليزي وتهدد سلامة السفن الصغيرة خاصة، وكيف تنشأ؟", ["الأنواء، تنشأ بمرور رياح قوية فوق تيارات بحرية دافئة صيفاً", "الضباب، ينشأ بمرور هواء جاف فوق تيارات بحرية دافئة جداً", "الضباب، ينشأ بمرور هواء محمل ببخار الماء فوق تيارات باردة", "الجليد، ينشأ بانخفاض الحرارة فوق تيارات بحرية دافئة شتاءً"], 2, "الضباب من الظواهر المناخية التي تعرض سلامة السفن، وخاصة الصغيرة منها، للخطر، وهو كثير الحدوث عندما تمر الكتل الهوائية المحملة ببخار الماء فوق تيارات بحرية باردة فيحدث تكاثف وتناثر لقطرات الماء في الهواء، وتكثر هذه الظاهرة في الخليج الفنلندي والقنال الإنكليزي والمناطق الساحلية القريبة من الموانئ المزدحمة."],
[1, "كيف أسهم توافر شبكة جيدة من خطوط النقل بين الإسكندرية وباقي جهات مصر في تصدرها الموانئ المصرية؟", ["باتساع ظهيرها فارتفعت كفاءتها وجذبت الخطوط الملاحية العالمية", "بتجنب أخطار الأنواء في يناير وفبراير عند دخول السفن الميناء", "بزيادة أعماق مسطحها المائي فاستقبلت السفن ذات الغاطس الكبير", "بتقصير المسافات بينها وبين الموانئ المجاورة فقل استهلاك الوقود"], 0, "كان لتوافر شبكة جيدة من خطوط النقل تربط الإسكندرية بباقي جهات مصر دور مباشر في تصدرها الموانئ المصرية في كفاءة التشغيل ونشاط الحركة الملاحية وجذب الخطوط البحرية العالمية المارة بشرقي المتوسط؛ إذ يساعد ذلك على اتساع الظهير الذي يخدمه الميناء فترتفع كفاءة تشغيله وتزداد قدرته على استقبال السفن."],
[1, "سفينة ضخمة تتجاوز أبعادها العمق والاتساع المقررين لإحدى القنوات البحرية الصناعية. ما النتيجة وفق المحاضرة؟", ["لا تستطيع المرور، لأن مقاييس القناة تحدد أبعاد السفن العابرة", "تمر بعد خفض سرعتها، لأن مقاييس القناة لا تتعلق بأبعاد السفن", "تمر بعد تغيير ميناء الوصول، لأن عمق الميناء لا يحدد مواصفات السفن", "تمر دون قيود، لأن النقل البحري لا يلتزم بطرق محددة المسار"], 0, "القنوات البحرية الصناعية مجارٍ بحرية شقها الإنسان بمقاييس خاصة من حيث العمق والاتساع، وتحدد هذه المقاييس أبعاد السفن التي يمكنها المرور، وبالتالي تسهم في تحديد مسارات الخطوط البحرية وطبيعة وحجم السفن العاملة عليها."],
[1, "يشغل مجموع البحار والمحيطات أكثر من 97% من المسطحات المائية فوق سطح الأرض، ومع ذلك فهي لا تكون مفتوحة دوماً أمام النشاط الملاحي للإنسان", 1, "تشغل البحار والمحيطات أكثر من 97% من إجمالي المسطحات المائية، لكنها لا تكون مفتوحة دوماً أمام النشاط الملاحي، إذ تؤثر فيه مجموعة من العوامل الطبيعية والبشرية."],
[1, "حقق النقل البحري أحسن فترة رواج له خلال العقد التالي لنهاية الحرب العالمية الأولى، وكان ينطلق يومياً من أرصفة نيويورك أكثر من 50 سفينة", 0, "أحسن فترات الرواج كانت في العشر سنوات التي أعقبت نهاية الحرب العالمية الثانية، وفيها كان ينطلق يومياً من أرصفة ميناء نيويورك أكثر من 50 سفينة تحمل بعضها ما يزيد على 1000 راكب."],
[1, "لم ينج من رحلة تيتانيك سوى 705 أشخاص من بين 2262 فرداً من الركاب وأفراد الطاقم", 1, "بلغ إجمالي الركاب وأفراد الطاقم في رحلة تيتانيك 2262 فرداً ولم يتجاوز عدد الناجين 705 أشخاص، فاستحقت لقب «أم الكوارث البحرية»."],
[1, "تربط قناة السويس بين المحيطين الأطلنطي والهادي، في حين تربط قناة بنما بين البحرين المتوسط والأحمر", 0, "قناة السويس تربط بين البحرين المتوسط والأحمر في مصر، أما قناة بنما فتربط بين المحيط الأطلنطي والمحيط الهادي."],
[1, "تشكل ظاهرة الأنواء خطراً كبيراً على السفن في الإسكندرية في بعض أيام شهري يوليو وأغسطس، خاصة عند دخول الميناء أو الخروج منه", 0, "تشكل ظاهرة الأنواء التي تتعرض لها مناطق كالإسكندرية خطراً كبيراً على السفن في بعض أيام شهري يناير وفبراير، وخاصة عند الدخول إلى الميناء أو الخروج منه."],

[2, "أي سفن الخدمات تستخدم لنقل المرشد الملاحي من السفينة وإليها لتسهيل دخولها وخروجها من الممرات الملاحية، وما الفرق بينها وبين زورق القطر؟", ["زورق القطر (Tugboat)، بينما يستخدم زورق الإرشاد لقطر السفن الكبيرة", "الحوض العائم، بينما يستخدم زورق القطر لنقل العاملين إلى المنصات", "الكراكة (Dredger)، بينما يستخدم زورق الإرشاد لرفع السفن لأعمال الإصلاح", "زورق الإرشاد (Pilot boat)، بينما يستخدم زورق القطر لسحب السفن الكبيرة"], 3, "زورق الإرشاد Pilot boat يستخدم لنقل المرشد الملاحي من وإلى السفن، أما زورق القطر Tugboat فيستخدم لقطر أو سحب السفن الكبيرة."],
[2, "أي ربط بين سفينة الخدمات ووظيفتها صحيح وفق المحاضرة؟", ["الكراكة: تقدم خدمات الإمداد وتنقل العاملين إلى منصات البترول", "سفينة الخدمات البترولية: ترفع السفن الثقيلة لأعمال الفحص والإصلاح", "الحوض العائم: سفينة غاطسة ترفع السفن الثقيلة للفحص والإصلاح", "زورق القطر: ينقل المرشد الملاحي من السفن وإليها عبر الممرات"], 2, "الحوض العائم Floating dock سفينة غاطسة تستخدم لرفع السفن لأعمال الفحص والإصلاح في المياه العميقة، أما سفن الخدمات البترولية Offshore vessels فتقدم خدمات الإمداد والإصلاح وتنقل العاملين من وإلى منصات وآبار البترول."],
[2, "وفق تعريف المنظمة البحرية الدولية (IMO)، متى تعد السفينة سفينة ركاب؟", ["إذا كانت مجهزة لنقل أكثر من 12 راكباً", "إذا كانت مجهزة لنقل أكثر من 120 راكباً", "إذا كانت مجهزة لنقل السائحين فقط دون غيرهم", "إذا كانت مجهزة لنقل أكثر من 500 راكب"], 0, "عرفت المنظمة البحرية الدولية IMO سفينة الركاب بأنها سفينة مجهزة لنقل أكثر من 12 راكباً، وعادة ما تحمل الركاب في خطوط ملاحية منتظمة بين الموانئ المختلفة."],
[2, "على متن سفينة ركاب تبحر بين ميناءين يوجد طاقم السفينة وسائحون ومسافرون لأغراض أخرى. من يعد راكباً وفق تعريف IMO؟", ["السائحون فقط دون المسافرين لأغراض أخرى على السفينة", "المسافرون في الدرجات الأولى والثانية دون السياحية فقط", "كل من على متن السفينة عدا الطاقم، أياً كان غرض سفره", "كل من على متن السفينة بما فيهم أفراد الطاقم العاملين"], 2, "الركاب هم كل الأشخاص المتواجدين على متن السفينة بخلاف أفراد طاقمها، وبغض النظر عن كونهم مسافرين في رحلة بحرية أو لغرض آخر."],
[2, "أي مجموعة من الخصائص تميز سفن الركاب وفق المحاضرة؟", ["مستوى معيشة منخفض، ودرجات للإعاشة، وسرعة عالية، واحتياطات عالية لمقاومة الحريق", "مستوى معيشة مرتفع، ودرجات للإعاشة، وسرعة عالية، واحتياطات عالية لمقاومة الحريق", "مستوى معيشة مرتفع، ودرجة إعاشة واحدة، وسرعة منخفضة، واحتياطات محدودة لمقاومة الحريق", "مستوى معيشة مرتفع، ودرجات للإعاشة، وسرعة منخفضة، واحتياطات عالية لمقاومة الحريق"], 1, "سفن الركاب عادة ما يكون مستوى المعيشة بها مرتفعاً، وتقسم أماكن إعاشة الركاب فيها إلى درجات Classes، وهي عالية السرعة بصفة عامة، وتتخذ بها احتياطات عالية جداً لمقاومة الحريق مع توافر معدات السلامة وأدوات الإنقاذ."],
[2, "أي مجموعة تضم أنواع العبارات السريعة (Fast ferries) فقط وفق المحاضرة؟", ["الهوفركرافت (Hovercraft) وعبارات الرورو العادية والكاتاماران", "الهوفركرافت (Hovercraft) والهيدروفويل (Hydrofoil) والكاتاماران", "الكاتاماران (Catamaran) وسفن الدحرجة Ro/Ro للبضائع والهوفركرافت", "الهيدروفويل (Hydrofoil) وسفن الكروز (Cruise) والكاتاماران"], 1, "العبارات السريعة Fast ferries هي: الهوفركرافت Hovercraft، والهيدروفويل Hydrofoil، والكاتاماران Catamaran. وتنقسم سفن الركاب إلى سفن الكروز والعبارات Ferries (ومنها عبارات Ro/Pax الرورو)."],
[2, "تختلف صياغة وزارة النقل - قطاع النقل البحري المصري لتعريف السفن السياحية (Cruise Ships) عن التعريف العام لها. أي مما يلي يطابق تعريف الوزارة؟", ["سفن تعمل في أعالي البحار ومخصصة لنقل السائحين فقط وتشبه فنادق عائمة فاخرة", "سفن مجهزة لنقل أكثر من 12 راكباً بخطوط ملاحية منتظمة بين الموانئ المختلفة", "سفن تنقل الركاب والبضائع معاً على خط إبحار ثابت وفق جدول معلن مسبقاً", "سفن لرحلات سياحية منتظمة أو غير منتظمة، تحمل ركاباً بأجر وتمارس عملاً تجارياً"], 3, "عرفت وزارة النقل - قطاع النقل البحري المصري السفن السياحية بأنها السفن المعدة للقيام برحلات سياحية منتظمة أو غير منتظمة وتحمل على متنها ركاباً بأجر وتمارس عملاً تجارياً."],
[2, "أي مما يلي يصف الرحلة البحرية على متن سفن الرحلات البحرية (الكروز) وفق المحاضرة؟", ["تستمر عدة أيام، وتعود غالباً إلى ميناء الإقلاع، وخدمتها درجات أولى وثانية وسياحية", "تستغرق ساعات قليلة، وتعود غالباً إلى ميناء الإقلاع، وخدمتها درجات أولى وثانية وسياحية", "تستمر عدة أيام، وتنتهي دائماً في ميناء مختلف، وخدمتها درجة واحدة فقط", "تستمر عدة أيام، وتعود غالباً إلى ميناء الإقلاع، وخدمتها درجة سياحية واحدة"], 0, "تستمر الرحلة البحرية على متن سفن الرحلات البحرية عدة أيام، وفي الغالب تعود السفينة لنفس الميناء الذي غادرت منه، وتنقسم الخدمة المقدمة على هذه السفن إلى الدرجات الأولى والثانية والسياحية."],
[2, "شركة تشغل سفينة كروز تتسع لنحو 4,000 راكب ضمن الجيل الذي ظهر مع بداية عام 2014. كيف تصنف هذه السفينة بحسب الحمولة؟", ["سفينة ضخمة جداً من فئة Super Mega (5000–8000 راكب)", "سفينة كبيرة الحجم تتراوح سعتها بين 1500 و3000 راكب", "سفينة ضخمة من فئة Mega Ships (3000–5000 راكب)", "سفينة متوسطة الحجم تتراوح سعتها بين 500 و1500 راكب"], 2, "ظهرت مع بداية عام 2014 سفن الكروز الضخمة التي تتراوح سعتها بين 3000 و5000 راكب وتعرف بـ Mega Ships، وما زاد على 5000 حتى 8000 تعرف بـ Super Mega."],
[2, "سفينة رحلات بحرية تتسع لنحو 450 راكباً وتتوافر فيها كل وسائل الخدمات والترويح. كيف تصنف وبأي اسم تعرف؟", ["سفينة متوسطة الحجم (Medium Ships)، وتعرف بـ Ultra Yachts فقط", "سفينة صغيرة الحجم (Small Ships)، وتعرف بـ Mini Cruisers أو Ultra Yachts", "سفينة متوسطة الحجم (Medium Ships)، وتعرف بـ Mini Cruisers أو Ultra Yachts", "سفينة صغيرة الحجم (Small Ships)، وتعرف بـ Mega Ships أو Super Mega"], 1, "السفن صغيرة الحجم Small Ships لا تتجاوز سعتها 500 راكب وتعرف بعدة أسماء منها سفن الرحلات البحرية صغيرة الحجم Mini Cruisers أو اليخوت كبيرة الحجم Ultra Yachts، أما المتوسطة فتتراوح سعتها بين 500 و1500 راكب."],
[2, "تختلف سفن الرحلات البحرية عن وسائل النقل الأخرى لأنها تؤدي دور المقصد السياحي في حد ذاتها. أي مجموعة من المرافق تدعم ذلك وفق المحاضرة؟", ["مطاعم وكبائن فقط، مع استخدام الظهر لتخزين العربات في جميع السفن", "مسرح وسينما وصالات ديسكو فقط، دون نادٍ صحي ولا مراكز رياضية", "نادٍ صحي ومسرح وسينما وحمام سباحة، دون محلات تسوق ولا مطاعم", "نادٍ صحي ومسرح وسينما وحمام سباحة ومحلات تسوق، والظهر للتشمس"], 3, "تتعدد المرافق في سفن الرحلات الحديثة: نادٍ صحي، ومركز للألعاب الرياضية، وحمام سباحة، ومسرح وسينما، وصالات ديسكو، ومحلات للهدايا والملابس والتسوق، ومطاعم وبارات، ويستخدم ظهر السفينة للتشمس بجوار حمامات السباحة، كما يوجد ببعض السفن مساحات شاسعة لتخزين مئات العربات والأتوبيسات."],
[2, "أي وصف يطابق الكبائن الكبيرة في سفن الرحلات البحرية وفق المحاضرة؟", ["تتسع لأكثر من أربعة أشخاص، وبها سريران دون منطقة جلوس ولا مرحاض خاص", "تتسع لأكثر من أربعة أشخاص، وبها سرير واحد ومرحاض مشترك في الممر", "تتسع لشخصين فقط، وبها سرير واحد ومنطقة جلوس ومرحاض مشترك", "تتسع لأكثر من أربعة أشخاص، وبها سريران ومنطقة جلوس ومرحاض خاص"], 3, "الكبائن تكون كبيرة تتسع لأكثر من أربعة أشخاص وللعائلات، وعادة تكون مزودة بسريرين ومكان منفصل لارتداء الملابس ومنطقة خاصة للجلوس والاستقبال ومرحاض خاص."],
[2, "السفن الخطية (Liners) تقتصر على نقل الركاب، بينما تقتصر السفن الجوالة (Tramps) على نقل البضائع", 0, "السفن الخطية لا تقتصر على الركاب؛ فمن سفن البضائع العامة التقليدية سفن البضائع العامة الخطية Liners وسفن البضائع العامة الجوالة Tramps. والخطية تتعلق بطريقة التشغيل المنتظمة لا بنوع الحمولة."],

[3, "يصل الركاب إلى محطة في الميناء لإنهاء إجراءات الوصول والمغادرة قبل الصعود إلى سفينة الكروز أو بعد النزول منها. ماذا تسمى هذه المحطة؟", ["ميناء الزيارة ضمن الرحلة (Port of call)", "رصيف ربط السفن في الميناء (Berth)", "الحوض الجاف لإصلاح السفن (Dry dock)", "محطة الرحلات البحرية (Cruise terminal)"], 3, "Cruise terminal هي محطة الميناء التي يتعامل فيها الركاب مع إجراءات الوصول والمغادرة."],

[3, "وصلت سفينة رحلات إلى ميناء الوصول الأخير وبدأ الركاب مغادرتها. ما المصطلح الذي يصف هذا الفعل، وما عكسه؟", ["Disembark، وعكسه Aboard أي النزول إلى الشاطئ", "Embark، وعكسه Disembark أي مغادرة السفينة", "Disembark، وعكسه Embark أي الصعود للسفينة", "Boarding، وعكسه Embark أي النزول منها"], 2, "Embark تعني الصعود إلى السفينة (To board a ship)، وDisembark تعني مغادرة السفينة (To leave the ship)، وBoarding تعني الصعود على متنها."],
[3, "أي ربط بين المصطلح ومعناه صحيح وفق المحاضرة؟", ["Deck: طابق السفينة، وOnshore / Ashore: على اليابسة", "Aboard: على اليابسة، وOnshore / Ashore: على سطح السفينة", "Deck: جسم السفينة، وOnshore / Ashore: على متن السفينة", "Cabin: غرفة قيادة السفينة، وDeck: مدخنة السفينة"], 0, "Deck هو طابق (أرضية) السفينة، وOnshore / Ashore تعني على اليابسة، وOnboard / Aboard تعني التواجد على متن السفينة، وCabin هي غرفة النوم على السفينة."],

[3, "ما الفرق بين Bow وStem وفق المحاضرة؟", ["Bow هو الجزء الأمامي فوق الماء، وStem هو الجزء الأمامي أسفل الماء", "Bow هو عرض السفينة وقياسه بالمتر، وStem هو رأسها أسفل الماء", "Bow هو مؤخرة السفينة، وStem هو مقدمتها فوق سطح الماء", "Bow هو الجزء الأمامي أسفل الماء، وStem رأس السفينة فوق الماء"], 3, "Bow: الجزء الأمامي من السفينة أسفل الماء، وStem: رأس أو مقدمة السفينة فوق الماء."],
[3, "أي مجموعة من التعريفات التالية صحيحة وفق المحاضرة؟", ["Stern: مؤخرة السفينة، وAft: الاتجاه نحو المؤخرة، وHull: جسمها", "Stern: الاتجاه نحو المؤخرة، وAft: مؤخرة السفينة، وHull: مدخنتها", "Stern: رأس السفينة، وAft: الاتجاه نحو المؤخرة، وFunnel: جسم السفينة", "Stern: مؤخرة السفينة، وAft: مقدمتها، وHull: جسم السفينة"], 0, "Stern: مؤخرة السفينة، وAft: الاتجاه نحو مؤخرتها، وShip hull: جسم السفينة، وFunnel: مدخنة السفينة."],

// ---------- RESULT SCENARIOS ----------
// [highest score % for this band, message, gif]. Point each gif at a file next to this page or at a URL.
const S=[
 [9,"Seriously, how do you even do that?","gif1.gif"],
 [19,"Is that all you got?","gif2.gif"],
 [29,"We’re getting somewhere","gif3.gif"],
 [39,"Congratulations, I guess","gif4.gif"],
 [49,"Go get ’em, tiger!","gif8.gif"],
 [59,"Keep it up!","gif7.gif"],
 [69,"Now we’re talking","gif6.gif"],
 [79,"Okay, we get it, bookworm","gif5.gif"],
 [89,"Somebody’s on fire!","gif9.gif"],
 [99,"Are you even human?!","gif10.gif"],
 [100,"Phenomenal is an understatement!!","gif11.gif"]
];

// normalise to [lecture(0/1), type(m/t), text, options|null, answerIndex, explanation]
const Q=R.map(x=>Array.isArray(x[2])?[x[0]-1,"m",x[1],x[2],x[3],x[4]]:[x[0]-1,"t",x[1],null,x[2]?0:1,x[3]]);
Q.sort((a,b)=>a[0]-b[0]||(a[1]==="m"?0:1)-(b[1]==="m"?0:1));
const N=Q.length,A=Array(N).fill(null),$=s=>document.querySelector(s),LT="ABCD",C=2*Math.PI*26;
let tm;
const AR=/[\u0600-\u06FF]/,dr=t=>AR.test(t)?' dir="rtl"':"";
$("#fg").setAttribute("stroke-dasharray",C);

function render(){
 let h="";
 Q.forEach((q,i)=>{
  if(!i)h+=`<h2>${L[q[0]]}</h2>`;else if(Q[i-1][0]!==q[0])h+=`<div class="sep"><span>The following questions are from ${L[q[0]]}</span></div>`;
  const o=q[3]||["True","False"];
  h+=`<div class="q" id="q${i}"><div class="meta">Question ${i+1} of ${N} · ${q[1]==="m"?"Multiple choice":"True or false"}</div><div class="qt"${dr(q[2])}>${q[2]}</div>`+
  o.map((t,j)=>`<button class="op" type="button" data-i="${i}" data-j="${j}"${dr(q[3]?t:q[2])}>${q[3]?`<b>${LT[j]}.</b>`:""}<span>${t}</span></button>`).join("")+`<div class="fb"></div></div>`;
 });
 $("#qs").innerHTML=h||'<div class="none">No questions yet.</div>';
}
$("#qs").addEventListener("click",e=>{const b=e.target.closest(".op");if(b)pick(+b.dataset.i,+b.dataset.j)});

const score=()=>A.filter((a,i)=>a===Q[i][4]).length;
// whole-number percentage; only a perfect score shows 100
const pct=ok=>!N?0:ok===N?100:Math.min(99,Math.round(ok/N*100));

function pick(i,j){
 if(A[i]!==null)return;A[i]=j;
 const q=Q[i],c=$("#q"+i),o=q[3]||["True","False"],f=c.querySelector(".fb");
 c.querySelectorAll(".op").forEach((b,k)=>{b.disabled=true;if(k===q[4])b.classList.add("ok");else if(k===j)b.classList.add("no")});
 if(j===q[4]){f.className="fb ok";f.textContent="✓ Correct answer"}
 else{f.className="fb no";f.innerHTML=`<strong>✗ Wrong answer.</strong> The correct answer:<div class="ar"${dr(q[3]?o[q[4]]:q[2])}><strong>${o[q[4]]}</strong></div><div class="ar"${dr(q[2])}>${q[5]}</div>`}
 upd();
 if(A.every(a=>a!==null)){clearTimeout(tm);tm=setTimeout(showResult,800)}
}
function upd(){
 const ok=score(),done=A.filter(a=>a!==null).length;
 $("#sc").textContent=ok+" / "+N;$("#rt").textContent=pct(ok)+"%";
 $("#fg").style.strokeDashoffset=C*(1-(N?ok/N:0));$("#wn").textContent=N-ok;
 $("#st").textContent=!N?"No questions yet":done===N?`Test finished: your score is ${ok} out of ${N}`:`You answered ${done} of ${N}`;
}

// ---------- final result pop-up ----------
const gif=$("#rgif");gif.onerror=()=>{gif.style.display="none"};
function showResult(){
 const ok=score(),p=pct(ok),s=S.find(x=>p<=x[0])||S[S.length-1];
 $("#rsc").textContent=ok+" / "+N;$("#rpc").textContent=p+"%";$("#rmsg").textContent=s[1];
 gif.style.display="";gif.src=s[2];
 $("#rov").classList.add("on");
}

// ---------- wrong answers pop-up (opened by the ? button) ----------
$("#wq").onclick=()=>{
 const l=Q.map((q,i)=>i).filter(i=>A[i]!==Q[i][4]);
 $("#wl").innerHTML=l.length?l.map(i=>`<button class="it" type="button" data-go="${i}"><span class="tag ${A[i]===null?"m":""}">${A[i]===null?"Missed":"Wrong"}</span>Q${i+1}: <bdi>${Q[i][2].slice(0,70)}${Q[i][2].length>70?"…":""}</bdi></button>`).join(""):"No wrong or missed questions 🎉";
 $("#ov").classList.add("on");
};
const close=()=>document.querySelectorAll(".ov").forEach(o=>o.classList.remove("on"));
$("#cl").onclick=close;$("#rx").onclick=close;$("#rcl").onclick=close;
document.querySelectorAll(".ov").forEach(o=>o.addEventListener("click",e=>{if(e.target===o)close()}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
$("#wl").addEventListener("click",e=>{
 const b=e.target.closest("[data-go]");if(!b)return;close();
 const c=$("#q"+b.dataset.go);c.scrollIntoView({behavior:"smooth",block:"start"});
 c.classList.remove("flash");void c.offsetWidth;c.classList.add("flash");
});

// ---------- reset ----------
$("#rs").onclick=()=>{
 clearTimeout(tm);close();
 A.fill(null);render();upd();
 window.scrollTo({top:0,behavior:"smooth"});
};

render();upd();
</script>
